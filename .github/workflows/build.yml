name: Build Fortnite External

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        working-directory: source
        run: |
          msbuild "FN.sln" /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Upload Loader.exe
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Fortnite-External-Release
          path: source/x64/Release/Loader.exe
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Purge old artifacts (best effort)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $page = 1
          while ($true) {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $resp = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            if (-not $resp.artifacts -or $resp.artifacts.Count -eq 0) { break }
            foreach ($a in $resp.artifacts) {
              if ($a.id -and $a.name -eq "Fortnite-External-Release") {
                try {
                  Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($a.id)" -Headers $headers -Method Delete
                  Write-Host "Deleted artifact $($a.id)"
                } catch {
                  Write-Host "Skip delete $($a.id): $_"
                }
              }
            }
            if ($page * 100 -ge $resp.total_count) { break }
            $page++
          }
