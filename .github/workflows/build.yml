name: Build Fortnite External

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Purge old artifacts
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $page = 1
          while ($true) {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $resp = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            if (-not $resp.artifacts -or $resp.artifacts.Count -eq 0) { break }
            foreach ($a in $resp.artifacts) {
              try {
                Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($a.id)" -Headers $headers -Method Delete
                Write-Host "Deleted artifact $($a.id) $($a.name)"
              } catch {
                Write-Host "Skip $($a.id): $_"
              }
            }
            if ($page * 100 -ge $resp.total_count) { break }
            $page++
          }

      - name: Build Release x64
        working-directory: source
        run: |
          msbuild "FN.sln" /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Verify Loader.exe exists
        shell: pwsh
        run: |
          $p = "source/x64/Release/Loader.exe"
          if (-not (Test-Path $p)) { throw "Loader.exe not found at $p" }
          Get-Item $p | Format-List FullName, Length, LastWriteTime

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fornite-latest
          name: FORNITE External (latest)
          body: |
            Build automatico desde `${{ github.sha }}`
            Archivo: `Loader.exe`
          files: source/x64/Release/Loader.exe
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
